<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>委托出租 · 前端 Demo | 盘古循环资源平台</title>
<style>
  :root{
    --brand:#0A54BA;
    --brand-2:#0F62D4;
    --brand-light:#E8F1FE;
    --danger:#EE0000;
    --text:#1F2329;
    --text-2:#7E8693;
    --border:#E5E8EF;
    --bg:#F4F5F8;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:56px;background:linear-gradient(90deg,#0A54BA,#0F62D4);
    display:flex;align-items:center;padding:0 20px;color:#fff;
    position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(10,84,186,.25);
  }
  .topbar .logo{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .topbar .logo small{font-weight:400;opacity:.85;font-size:12px;margin-left:8px;}
  .topbar .badge{
    margin-left:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    padding:2px 10px;border-radius:11px;font-size:12px;
  }
  .topbar .spacer{flex:1;}
  .topbar .user{font-size:13px;opacity:.95;}
  .topbar .user b{font-weight:600;}

  /* ---------- 布局 ---------- */
  .layout{display:flex;height:calc(100% - 56px);}
  .sidebar{
    width:210px;background:#fff;border-right:1px solid var(--border);
    padding:12px 0;overflow-y:auto;flex-shrink:0;
  }
  .nav-group{margin-bottom:6px;}
  .nav-group-title{
    font-size:12px;color:var(--text-2);padding:10px 18px 6px;letter-spacing:1px;
  }
  .nav-item{
    display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:14px;
    color:#3D4553;cursor:pointer;border-left:3px solid transparent;user-select:none;
  }
  .nav-item:hover{background:#F7F9FC;color:var(--brand);}
  .nav-item.active{background:var(--brand-light);color:var(--brand);font-weight:600;border-left-color:var(--brand);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;}

  .main{flex:1;overflow-y:auto;padding:18px 22px 40px;}

  /* ---------- 页头 ---------- */
  .page-head{display:flex;align-items:center;margin-bottom:16px;}
  .page-head h2{margin:0;font-size:19px;font-weight:600;}
  .page-head .sub{margin-left:10px;font-size:12px;color:var(--text-2);}
  .page-head .spacer{flex:1;}
  .btn{
    height:34px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);
    background:#fff;color:var(--text);font-size:14px;
  }
  .btn.primary{background:linear-gradient(90deg,#0A54BA,#0F62D4);border-color:transparent;color:#fff;font-weight:600;}
  .btn+.btn{margin-left:10px;}

  /* ---------- 卡片 ---------- */
  .card{
    background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:20px;margin-bottom:16px;
  }
  .card h3{margin:0 0 6px;font-size:15px;font-weight:600;}
  .card p{margin:0;color:var(--text-2);font-size:13px;}

  /* ---------- 状态提示 ---------- */
  .notice{
    background:#FFF9E8;border:1px solid #FFE08A;color:#8A6100;
    border-radius:8px;padding:14px 18px;font-size:13px;margin-bottom:16px;
  }
  .notice b{color:#7A5200;}

  /* ---------- 流程步骤 ---------- */
  .steps{display:flex;gap:0;margin-top:18px;flex-wrap:wrap;}
  .step{
    flex:1;min-width:130px;position:relative;padding:0 8px;
  }
  .step .idx{
    width:26px;height:26px;border-radius:50%;background:var(--brand-light);color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    margin-bottom:8px;
  }
  .step .t{font-size:13px;font-weight:600;margin-bottom:3px;}
  .step .d{font-size:12px;color:var(--text-2);line-height:1.45;}
  .step:not(:last-child)::after{
    content:"";position:absolute;top:13px;right:-1px;width:8px;height:1px;background:var(--border);
  }

  /* ---------- 占位区 ---------- */
  .placeholder{
    border:2px dashed #D3DAE6;border-radius:8px;background:#FBFCFE;
    padding:44px 20px;text-align:center;color:var(--text-2);
  }
  .placeholder .ico{font-size:34px;opacity:.4;margin-bottom:10px;}
  .placeholder .h{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px;}
  .placeholder .s{font-size:13px;}

  /* ===== 新增：嵌入式原型容器 + 快捷入口 ===== */
  .topbar .jump{
    margin-left:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
    color:#fff;text-decoration:none;padding:4px 12px;border-radius:13px;font-size:12px;
  }
  .topbar .jump:hover{background:rgba(255,255,255,.28);}
  .main{overflow:hidden;position:relative;}
  .embed-wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  .embed-bar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:7px 14px;background:#fff;border-bottom:1px solid var(--border);
    font-size:12px;color:var(--text-2);
  }
  .embed-bar .path{color:var(--brand);font-weight:600;}
  .embed-bar .spacer{flex:1;}
  .embed-bar a{
    color:var(--brand);text-decoration:none;border:1px solid #BFDDF5;background:#F5F9FF;
    padding:3px 10px;border-radius:12px;
  }
  .embed-bar a:hover{background:#E8F1FE;}
  .embed-wrap iframe{flex:1;width:100%;border:0;background:#fff;display:block;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px;}
  .entry{
    display:block;border:1px solid var(--border);border-radius:4px;padding:11px 13px;
    text-decoration:none;color:var(--text);background:#fff;
  }
  .entry:hover{border-color:var(--brand);background:var(--brand-light);}
  .entry .t{color:var(--brand);font-weight:600;font-size:13px;margin-bottom:3px;}
  .entry .d{font-size:12px;color:var(--text-2);line-height:1.5;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">盘古循环资源平台<small>委托出租</small></div>
  <div class="badge">前端 Demo · 待开发</div>
  <div class="spacer"></div>
  <div class="user">当前用户：<b>演示用户</b></div>
  <a class="jump" href="委托出租原型/index.html" target="_blank" rel="noopener">打开完整原型 ↗</a>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
const $ = s => document.querySelector(s);

/* =====================================================================
   菜单 → 委托出租原型页面 映射
   url = 要嵌入的原型页面；点击菜单在右侧 iframe 打开。
   ===================================================================== */
const NAV = [
  {group:'委托出租', items:[
    {key:'manage',  label:'出租委托管理', url:'委托出租原型/index.html', note:'原型总览'},
    {key:'publish', label:'发布出租房源', url:'委托出租原型/a01.html',   note:'委托方 · 新增出租商品'},
    {key:'query',   label:'出租委托查询', url:'委托出租原型/a02.html',   note:'委托方 · 委托商品管理'}
  ]},
  {group:'运营管理', items:[
    {key:'audit',     label:'委托审核', url:'委托出租原型/s02.html',     note:'服务方 · 订单审核'},
    {key:'negotiate', label:'议价审核', url:'委托出租原型/s03.html',     note:'服务方 · 接单（含议价出口）'}
  ]},
  {group:'商城前台', items:[
    {key:'mall', label:'出租专区', url:'委托出租原型/b01.html',          note:'承租方 · 委托商品列表'}
  ]}
];

/* 保留原 Demo 的 5 环节骨架，用于首屏说明 */
const STEPS = [
  {t:'提交出租委托', d:'填写店铺信息、期望租金、可租周期等'},
  {t:'平台审核',     d:'核对产权资料与店铺情况'},
  {t:'挂牌展示',     d:'进入出租专区对外展示'},
  {t:'意向洽谈',     d:'承租方咨询、在线议价'},
  {t:'签约成交',     d:'生成租赁合同并归档'}
];

/* 快捷入口 */
const ENTRIES = [
  ['原型的全流程（推荐）','委托出租原型/index.html','37 个页面：承租方 → 服务方 → 委托方'],
  ['页面级需求说明',      '委托出租原型/spec.html', '每页字段、关键规则、出口跳转'],
  ['承租方侧 15 页',      '委托出租原型/b01.html',  '下单 → 审核 → 押金 → 签收 → 对账 → 归还 → 押金退还 → 开票'],
  ['服务方侧 11 页',      '委托出租原型/s01.html',  '接单工作台 → 审核 → 接单 → 发货 → 对账 → 委托结算 → 开票'],
  ['委托方侧 11 页',      '委托出租原型/a01.html',  '新增出租商品 → 自动委托 → 上架 → 发货 → 结算 → 开票'],
  ['门户页入口',          '租售店铺（lxj0530）.html','「出租业务」页签右侧已新增「委托出租」']
];

let currentView = 'manage';

function renderSidebar(){
  $('#sidebar').innerHTML = NAV.map(g => `
    <div class="nav-group">
      <div class="nav-group-title">${g.group}</div>
      ${g.items.map(it => `
        <div class="nav-item ${currentView===it.key?'active':''}" onclick="switchView('${it.key}')">
          <span class="dot"></span>${it.label}
        </div>`).join('')}
    </div>`).join('');
}

function stepsHtml(){
  return `<div class="steps">${STEPS.map((s,i) => `
    <div class="step">
      <div class="idx">${i+1}</div>
      <div class="t">${s.t}</div>
      <div class="d">${s.d}</div>
    </div>`).join('')}</div>`;
}

/* ---------- 首屏 ---------- */
function viewManage(){
  return `
    <div class="page-head">
      <h2>出租委托管理</h2>
      <span class="sub">委托出租 · 全流程</span>
      <div class="spacer"></div>
      <button class="btn primary" onclick="switchView('publish')">+ 新建出租委托</button>
    </div>
    <div class="notice">
      <b>本 Demo 已接入「委托出租原型」。</b>点击左侧菜单，即可在右侧打开对应的业务页面。
      请注意：本页的 5 环节是<b>店铺出租</b>的简化骨架，而「委托出租原型」实现的是
      <b>委托出租全流程</b>（提交订单 → 审核 → 押金付款 → 接单 → 发货 → 签收 → 对账付款 →
      商品归还 → 押金退还 → 开票 → 结束订单），两者口径不同，按需取用。
    </div>
    <div class="card">
      <h3>快捷入口</h3>
      <p>直接进入原型的关键页面（新标签页打开）：</p>
      <div class="grid">
        ${ENTRIES.map(e => `
          <a class="entry" href="${e[1]}" target="_blank" rel="noopener">
            <div class="t">${e[0]} ↗</div>
            <div class="d">${e[2]}</div>
          </a>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>业务流程（本 Demo 骨架，仅作参考）</h3>
      <p>店铺出租从提交到成交，共 5 个环节：</p>
      ${stepsHtml()}
    </div>`;
}

/* ---------- 嵌入式原型页 ---------- */
function viewEmbed(item){
  return `
    <div class="embed-wrap">
      <div class="embed-bar">
        <span class="path">${item.label}</span>
        <span>· ${item.note}</span>
        <span class="spacer"></span>
        <a href="${item.url}" target="_blank" rel="noopener">新标签页打开 ↗</a>
      </div>
      <iframe src="${item.url}" title="${item.label}" loading="lazy"></iframe>
    </div>`;
}

function switchView(key){
  currentView = key;
  renderSidebar();
  const item = NAV.reduce((a,g)=>a.concat(g.items),[]).find(i => i.key === key);
  $('#main').innerHTML = (item && item.url) ? viewEmbed(item) : viewManage();
  $('#main').scrollTop = 0;
}

/* 支持 URL hash 直接定位，如 委托出租功能_Demo.html#audit */
(function init(){
  const h = (location.hash || '').replace('#','');
  const hit = NAV.reduce((a,g)=>a.concat(g.items),[]).some(i => i.key === h);
  switchView(hit ? h : 'manage');
})();
</script>
</body>
</html>

</html>
