<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>委托出售 · 前端 Demo | 盘古循环资源平台</title>
<style>
  :root{
    --brand:#0A54BA;
    --brand-2:#0F62D4;
    --brand-light:#E8F1FE;
    --danger:#EE0000;
    --text:#1F2329;
    --text-2:#7E8693;
    --border:#E5E8EF;
    --bg:#F4F5F8;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:56px;background:linear-gradient(90deg,#0A54BA,#0F62D4);
    display:flex;align-items:center;padding:0 20px;color:#fff;
    position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(10,84,186,.25);
  }
  .topbar .logo{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .topbar .logo small{font-weight:400;opacity:.85;font-size:12px;margin-left:8px;}
  .topbar .badge{
    margin-left:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    padding:2px 10px;border-radius:11px;font-size:12px;
  }
  .topbar .spacer{flex:1;}
  .topbar .user{font-size:13px;opacity:.95;}
  .topbar .user b{font-weight:600;}

  /* ---------- 布局 ---------- */
  .layout{display:flex;height:calc(100% - 56px);}
  .sidebar{
    width:210px;background:#fff;border-right:1px solid var(--border);
    padding:12px 0;overflow-y:auto;flex-shrink:0;
  }
  .nav-group{margin-bottom:6px;}
  .nav-group-title{
    font-size:12px;color:var(--text-2);padding:10px 18px 6px;letter-spacing:1px;
  }
  .nav-item{
    display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:14px;
    color:#3D4553;cursor:pointer;border-left:3px solid transparent;user-select:none;
  }
  .nav-item:hover{background:#F7F9FC;color:var(--brand);}
  .nav-item.active{background:var(--brand-light);color:var(--brand);font-weight:600;border-left-color:var(--brand);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;}

  .main{flex:1;overflow-y:auto;padding:18px 22px 40px;}

  /* ---------- 通用组件 ---------- */
  .page-title{font-size:18px;font-weight:700;margin:0 0 4px;}
  .page-sub{color:var(--text-2);font-size:13px;margin-bottom:16px;}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);}
  .card+.card{margin-top:16px;}
  .card-head{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;
  }
  .card-head h3{margin:0;font-size:15px;}
  .card-body{padding:16px;}

  .btn{
    border:1px solid var(--border);background:#fff;color:#3D4553;
    padding:6px 14px;border-radius:4px;font-size:13px;transition:.15s;
  }
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff;}
  .btn.danger{color:var(--danger);border-color:#F5C2C2;}
  .btn.danger:hover{background:#FFF1F0;border-color:var(--danger);}
  .btn.sm{padding:3px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  input,select{
    font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);
    border-radius:4px;outline:none;color:var(--text);background:#fff;
  }
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(10,84,186,.1);}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4553;}
  label.field>span i{color:var(--danger);font-style:normal;margin-right:2px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}

  /* ---------- 统计卡 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat .k{font-size:12px;color:var(--text-2);}
  .stat .v{font-size:24px;font-weight:700;margin-top:6px;color:var(--brand);}
  .stat .v small{font-size:13px;font-weight:400;color:var(--text-2);margin-left:4px;}

  /* ---------- 流程条 ---------- */
  .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .flow .step{display:flex;align-items:center;gap:8px;font-size:13px;color:#3D4553;}
  .flow .num{width:22px;height:22px;border-radius:50%;background:var(--brand-light);color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .flow .arrow{color:#C4CAD4;font-size:12px;}

  /* ---------- 表格 ---------- */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th{
    background:#FAFBFC;text-align:left;padding:10px 12px;font-weight:600;color:#4A5262;
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.tbl td{padding:10px 12px;border-bottom:1px solid #F0F2F6;vertical-align:middle;}
  table.tbl tr:hover td{background:#F9FBFE;}
  table.tbl td.ops{white-space:nowrap;}
  table.tbl td.ops .btn{margin-right:6px;}
  table.tbl td.mono{font-family:Consolas,Monaco,monospace;font-size:12px;color:#4A5262;}
  .empty{padding:40px;text-align:center;color:var(--text-2);}

  .tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;line-height:18px;white-space:nowrap;}
  .tag.consign{background:#FFF3E0;color:#D4680A;border:1px solid #FFE0B2;}

  /* ---------- 弹窗 / 抽屉 ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:flex;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal{background:#fff;border-radius:8px;width:900px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .modal-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;flex:1;}
  .modal-head .x{border:none;background:none;font-size:20px;color:var(--text-2);line-height:1;}
  .modal-body{padding:18px 20px;max-height:62vh;overflow-y:auto;}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:620px;max-width:100%;background:#fff;z-index:101;
    box-shadow:-8px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;}
  .drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
  .drawer-head h3{margin:0;font-size:16px;flex:1;}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 20px;}

  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;}
  .form-grid .col-2{grid-column:span 2;}
  .form-grid .col-3{grid-column:span 3;}
  .sec-title{font-size:14px;font-weight:700;margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--brand);}

  table.edit{width:100%;border-collapse:collapse;font-size:13px;}
  table.edit th{background:#FAFBFC;padding:8px;border:1px solid var(--border);font-weight:600;font-size:12px;white-space:nowrap;}
  table.edit td{border:1px solid var(--border);padding:4px;}
  table.edit input{width:100%;border:none;padding:6px 8px;font-size:13px;}
  table.edit input:focus{box-shadow:none;}
  table.edit .del{color:var(--danger);border:none;background:none;font-size:12px;}

  .kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;}
  .kv .k{color:var(--text-2);}

  .toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:#1F2329;color:#fff;padding:9px 18px;border-radius:4px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);
    animation:fade .25s ease;}
  .toast.ok{background:#1B7A3D;}
  .toast.err{background:#C31D1D;}
  @keyframes fade{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

  /* ---------- 商城前台 ---------- */
  .mall-top{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
  .mall-top .entry{display:flex;gap:22px;}
  .mall-top .entry span{font-size:14px;color:#3D4553;cursor:pointer;padding:4px 2px;border-bottom:2px solid transparent;}
  .mall-top .entry span:hover{color:var(--brand);}
  .mall-top .entry span.hl{color:var(--brand);font-weight:700;border-bottom-color:var(--brand);}
  .prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .prod{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.2s;}
  .prod:hover{box-shadow:0 8px 22px rgba(10,84,186,.12);transform:translateY(-2px);}
  .prod .thumb{height:120px;background:linear-gradient(135deg,#EAF1FB,#F4F7FC);display:flex;align-items:center;
    justify-content:center;color:#B9C6DA;font-size:34px;position:relative;}
  .prod .thumb .tag{position:absolute;top:8px;right:8px;}
  .prod .info{padding:12px 14px;}
  .prod .name{font-size:14px;font-weight:600;margin-bottom:6px;height:40px;overflow:hidden;}
  .prod .price{color:var(--danger);font-size:17px;font-weight:700;}
  .prod .price small{font-size:12px;font-weight:400;color:var(--text-2);}
  .prod .shop{font-size:12px;color:var(--text-2);margin-top:8px;display:flex;justify-content:space-between;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">铁建云链 <small>· 循环物资 · 租售店铺</small></div>

<script>

function nextNo(pfx, mid){

  return pfx + (mid||'20261101') + String(CTR[pfx]).padStart(4,'0');

  {no:'RC2026110003', leg:1, orderNo:'ORD20261101000299', amount:1500, status:'已创建'},

/* 计算某委托单的汇总 */
function calc(o){
  let totalQty=0, floorAmt=0, listAmt=0;
  o.items.forEach(it=>{
    totalQty += Number(it.qty)||0;
    floorAmt += (Number(it.qty)||0)*(Number(it.floor)||0);
    listAmt  += (Number(it.qty)||0)*(Number(it.list)||0);
  });
  // 已售/余量按状态模拟
  const ratio = o.status==='已结清'||o.status==='售罄' ? 1
              : o.status==='部分售出' ? 0.35
              : o.status==='委托中' ? 0.12 : 0;
  const soldQty = Math.round(totalQty*ratio*100)/100;
  const remainQty = Math.round((totalQty-soldQty)*100)/100;
  const goodsAmount = soldQty * (o.items[0] ? (Number(o.items[0].list)||0) : 0);
  const commissionRate = 3;                       // 平台佣金费率 %（对齐「委托买卖」）
  const shopShareRate  = 1.5;                     // 受托店铺分成 %
  const commission = Math.max(goodsAmount*commissionRate/100, soldQty>0?50:0);
  const shopShare  = goodsAmount*shopShareRate/100;
  const settleAmount = Math.max(goodsAmount - commission - shopShare, 0);
  return {totalQty, floorAmt, listAmt, soldQty, remainQty, goodsAmount, commissionRate, shopShareRate, commission, shopShare, settleAmount};
}

function saveOrder(submit){
  const title = ($('#c-title').value||'').trim();
  const cname = ($('#c-cname').value||'').trim();
  if(!title){ toast('请填写委托标题','err'); return; }
  if(!cname){ toast('请填写委托方名称','err'); return; }

  const rows = [...document.querySelectorAll('#item-body tr')];
  const items = [];
  for(const r of rows){
    const name = r.querySelector('.i-name').value.trim();
    if(!name) continue;
    const floor = Number(r.querySelector('.i-floor').value)||0;
    const list  = Number(r.querySelector('.i-list').value)||0;
    if(list > 0 && list < floor){
      toast('挂牌价不得低于底价（'+name+'）','err'); return;
    }
    items.push({
      name, spec:r.querySelector('.i-spec').value.trim(),
      unit:r.querySelector('.i-unit').value.trim(),
      qty:Number(r.querySelector('.i-qty').value)||0,
      newDegree:r.querySelector('.i-deg').value.trim(),
      floor, list, tax:Number(r.querySelector('.i-tax').value)||0
    });
  }
  if(!items.length){ toast('请至少填写一条物资明细','err'); return; }

  const o = {
    no: genNo(), title,
    consignorType:$('#c-ctype').value, consignorName:cname,
    sourceType:$('#c-source').value, consigneeShop:$('#c-shop').value,
    tradeType:$('#c-trade').value,
    start:$('#c-start').value, end:$('#c-end').value,
    status: submit ? '待审' : '草稿',
    items
  };
  orders.unshift(o);
  closeOverlay();
  toast(submit ? ('已提交审核：'+o.no) : ('已存为草稿：'+o.no), 'ok');
  switchView('manage');
}

/* =========================================================
   幂等块：买方下单 / 议价（商城前台）
   ========================================================= */
/* 立即下单（不议价）→ 直接按店铺分组进入接单池 */
function placeOrder(orderNo, idx){
  const o = orders.find(x=>x.no===orderNo); if(!o) return;
  const it = o.items[idx]; if(!it) return;
  const g = SHOP_GROUPS[acceptPool.length % SHOP_GROUPS.length];
  const no = nextOrderNo();
  acceptPool.unshift({no, orderNo, product:it.name+' '+it.spec, qty:Number(it.qty)||1,
    groupCode:g.code, groupName:g.name, shop:g.shop, status:'待接单'});
  toast('下单成功（不议价）：'+no+'，已按分组「'+g.name+'」进入接单池（BR-08）','ok');
}

/* 议价弹窗（出价 + 数量，出价须 ≥ 底价，底价仅弹窗内内部提示） */
function openNegotiation(orderNo, idx){
  const o = orders.find(x=>x.no===orderNo); if(!o) return;
  const it = o.items[idx]; if(!it) return;
  openModal(`
    <div class="modal-head"><h3>发起议价 · ${esc(it.name)}</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-body">
      <div class="kv">
        <div class="k">挂牌价</div><div class="mono">¥${fmt(it.list)} / ${esc(it.unit)}</div>
        <div class="k">底价（内部）</div><div class="mono" style="color:#D4680A">¥${fmt(it.floor)} / ${esc(it.unit)}</div>
        <div class="k">受托店铺</div><div>${esc(o.consigneeShop)}</div>
      </div>
      <div class="form-grid" style="margin-top:14px">
        <label class="field"><span><i>*</i>议价出价(元)</span>
          <input id="ng-offer" type="number" min="0" value="${it.list}" placeholder="不得低于底价"></label>
        <label class="field"><span><i>*</i>数量</span>
          <input id="ng-qty" type="number" min="1" value="1"></label>
      </div>
      <p style="color:var(--text-2);font-size:12px;margin:12px 0 0">
        * 议价结果不得低于底价（BR-07）；底价仅委托方与平台内部可见，前台不下发。议价须服务方审核通过后方可接单。
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn primary" onclick="submitNegotiation('${orderNo}', ${idx})">提交议价</button>
    </div>`, 520);
}
function submitNegotiation(orderNo, idx){
  const o = orders.find(x=>x.no===orderNo); if(!o) return;
  const it = o.items[idx]; if(!it) return;
  const offer = Number($('#ng-offer').value)||0;
  const qty = Number($('#ng-qty').value)||0;
  if(qty<=0){ toast('请填写议价数量','err'); return; }
  if(offer < (Number(it.floor)||0)){ toast('议价出价不得低于底价（BR-07）','err'); return; }
  const no = nextNo('NG');
  negotiations.unshift({no, sku:'CSKU'+String(orderNo).slice(-6), product:it.name+' '+it.spec,
    shop:o.consigneeShop, listPrice:Number(it.list), offerPrice:offer, qty,
    floor:Number(it.floor), buyer:'某某采购商', status:'待审核'});
  closeOverlay();
  toast('议价单已提交：'+no+'，待服务方审核','ok');
}

            <th>底价（内部）</th><th>数量</th><th>买方</th><th>状态</th><th>操作</th>

function negotiateOps(n){
  if(n.status!=='待审核') return '<span style="color:var(--text-2);font-size:12px">已处理</span>';
  return `<button class="btn sm primary" onclick="approveNegotiation('${n.no}')">通过</button>
          <button class="btn sm danger" onclick="openNegoReject('${n.no}')">驳回</button>`;
}
function approveNegotiation(no){
  const n = negotiations.find(x=>x.no===no); if(!n) return;
  if(n.status!=='待审核'){ toast('该议价单已处理（CONSIGN_0002）','err'); return; }
  if(Number(n.offerPrice) < Number(n.floor)){ toast('议价出价低于底价，不可通过（BR-07）','err'); return; }
  n.status = '通过';
  const g = SHOP_GROUPS[acceptPool.length % SHOP_GROUPS.length];
  const ono = nextOrderNo();
  acceptPool.unshift({no:ono, orderNo:n.sku, product:n.product, qty:n.qty,
    groupCode:g.code, groupName:g.name, shop:g.shop, status:'待接单'});
  toast('议价通过：'+no+'，已完成接单分派「'+g.name+'」→ 接单池 '+ono,'ok');
  switchView('negotiate');
}
function openNegoReject(no){
  openModal(`
    <div class="modal-head"><h3>驳回议价单 ${esc(no)}</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-body">

          placeholder="请填写驳回原因，将同步给买方，买方可重新议价 / 下单"></textarea>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn danger" onclick="rejectNegotiation('${no}')">确认驳回</button>
    </div>`, 460);
}
function rejectNegotiation(no){
  const v = ($('#ngo-opinion').value||'').trim();
  if(!v){ toast('请填写驳回意见','err'); return; }
  const n = negotiations.find(x=>x.no===no);
  if(n) n.status = '驳回';
  closeOverlay();
  toast('已驳回议价：'+no,'ok');
  switchView('negotiate');
}

function acceptOps(p){
  if(p.status==='待接单') return `<button class="btn sm primary" onclick="acceptOrder('${p.no}')">接单</button>`;

}

function shippingOps(s){
  if(s.status==='待发货') return `<button class="btn sm primary" onclick="shipOrder('${s.no}')">委托方按单发货</button>`;
  if(s.status==='已发货') return `<button class="btn sm primary" onclick="signOrder('${s.no}')">买方签收</button>`;
  return '<span style="color:var(--text-2);font-size:12px">已签收 · 可发起退货</span>';
}
function shipOrder(no){
  const s = shippings.find(x=>x.no===no); if(!s) return;
  if(s.status!=='待发货'){ toast('当前状态不允许发货（CONSIGN_0002）','err'); return; }
  s.status = '已发货';
  s.shipTime = '2026-11-05 10:00';
  toast('委托方（卖方）已按发货单详情发货：'+no,'ok');
  switchView('shipping');
}
function signOrder(no){
  const s = shippings.find(x=>x.no===no); if(!s) return;
  if(s.status!=='已发货'){ toast('当前状态不允许签收（CONSIGN_0002）','err'); return; }
  s.status = '已签收';
  s.signTime = '2026-11-06 15:30';
  toast('买方已签收：'+no+'，可发起退货单','ok');
  switchView('shipping');
}
function openCreateShipping(){
  openModal(`
    <div class="modal-head"><h3>新增发货单（服务方建单）</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field"><span><i>*</i>订单号</span><input id="sh-order" placeholder="如：ORD20261101000306"></label>
        <label class="field col-2"><span><i>*</i>商品</span><input id="sh-product" placeholder="如：支撑架螺栓 M16×80mm"></label>
        <label class="field"><span><i>*</i>发货数量</span><input id="sh-qty" type="number" min="1" value="1"></label>
      </div>
      <p style="color:var(--text-2);font-size:12px;margin:12px 0 0">
        * 建单方为服务方（华南公司），建单后订单置「执行中」并锁定委托库存；实际发货由委托方（卖方）按本单详情执行。
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn primary" onclick="saveShipping()">创建发货单</button>
    </div>`, 620);
}
function saveShipping(){
  const orderNo = ($('#sh-order').value||'').trim();
  const product = ($('#sh-product').value||'').trim();
  const qty = Number($('#sh-qty').value)||0;
  if(!orderNo){ toast('请填写订单号','err'); return; }
  if(!product){ toast('请填写商品','err'); return; }
  if(qty<=0){ toast('请填写发货数量','err'); return; }
  const no = nextNo('SH');
  shippings.unshift({no, orderNo, product, qty, status:'待发货',
    createdBy:'服务方（华南公司）', shipBy:'委托方（卖方）', shipTime:'', signTime:''});
  closeOverlay();
  toast('发货单已创建：'+no+'（待委托方按单发货）','ok');
  switchView('shipping');
}

/* =========================================================
   视图 8：销售对账（双腿）
   ========================================================= */
function legTag(leg){
  if(leg===2) return '<span class="tag" style="color:#08979C;background:#E6FFFB;border:1px solid #08979C22">腿二 · 服务方↔委托方</span>';
  return '<span class="tag" style="color:#0A54BA;background:#E8F1FE;border:1px solid #0A54BA22">腿一 · 买方↔服务方</span>';
}
function legName(leg){ return leg===2 ? '服务方↔委托方' : '买方↔服务方'; }

function viewReconcile(){
  const rows = reconciles.map(r=>`
      <tr>
        <td class="mono">${esc(r.no)}</td>
        <td>${legTag(r.leg)}</td>
        <td class="mono">${esc(r.orderNo)}</td>
        <td class="mono">¥${fmt(r.amount)}</td>
        <td>${statusTag(r.status)}</td>
        <td class="ops">${reconcileOps(r)}</td>
      </tr>`).join('');

  return `
    <h2 class="page-title">销售对账 · 双腿对账</h2>
    <div class="page-sub">腿一「买方↔服务方」、腿二「服务方↔委托方」分别「创建 → 复核 → 付款 → 到账」；委托结算在腿二扣佣后结算给委托方（BR-11 / §3.9）</div>
    <div class="stats">
      <div class="stat"><div class="k">对账单总数</div><div class="v">${reconciles.length}<small>单</small></div></div>
      <div class="stat"><div class="k">腿一（买方↔服务方）</div><div class="v">${reconciles.filter(r=>r.leg===1).length}<small>单</small></div></div>
      <div class="stat"><div class="k">腿二（服务方↔委托方）</div><div class="v">${reconciles.filter(r=>r.leg===2).length}<small>单</small></div></div>
      <div class="stat"><div class="k">已到账</div><div class="v" style="color:#389E0D">${reconciles.filter(r=>r.status==='已到账').length}<small>单</small></div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>对账单列表</h3>
        <div style="flex:1"></div>
        <button class="btn primary" onclick="openCreateReconcile()">+ 创建对账单</button>
      </div>
      <div class="card-body" style="padding:0">
        <table class="tbl">
          <thead><tr>
            <th>对账单号</th><th>对账腿</th><th>订单号</th><th>对账金额</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">暂无对账单</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}
function reconcileOps(r){
  if(r.status==='待创建') return `<button class="btn sm primary" onclick="reconcileStep('${r.no}','create')">创建对账单</button>`;
  if(r.status==='已创建') return `<button class="btn sm primary" onclick="reconcileStep('${r.no}','review')">复核</button>`;
  if(r.status==='已复核') return `<button class="btn sm primary" onclick="reconcileStep('${r.no}','pay')">付款</button>`;
  if(r.status==='已付款') return `<button class="btn sm primary" onclick="reconcileStep('${r.no}','arrive')">到账确认</button>`;
  return '<span style="color:var(--text-2);font-size:12px">已到账 · 完成</span>';
}
function reconcileStep(no, step){
  const r = reconciles.find(x=>x.no===no); if(!r) return;
  const map = {
    create:{from:'待创建', to:'已创建', msg:'已创建对账单（'+legName(r.leg)+'）'},
    review:{from:'已创建', to:'已复核', msg:'对账单复核通过'},
    pay:   {from:'已复核', to:'已付款', msg:'对账单已付款'},
    arrive:{from:'已付款', to:'已到账', msg:'到账确认完成'}
  };
  const m = map[step];
  if(!m || r.status!==m.from){ toast('当前状态不允许该操作（CONSIGN_0002）','err'); return; }
  r.status = m.to;
  toast(m.msg+'：'+no,'ok');
  switchView('reconcile');
}
function openCreateReconcile(){
  openModal(`
    <div class="modal-head"><h3>创建销售对账单</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field"><span><i>*</i>对账腿</span>
          <select id="rc-leg"><option value="1">腿一 · 买方↔服务方</option><option value="2">腿二 · 服务方↔委托方</option></select></label>
        <label class="field"><span><i>*</i>订单号</span><input id="rc-order" placeholder="如：ORD20261101000306"></label>
        <label class="field"><span><i>*</i>对账金额(元)</span><input id="rc-amount" type="number" min="0" value="0"></label>
      </div>
      <p style="color:var(--text-2);font-size:12px;margin:12px 0 0">
        * 创建后进入「待创建」状态，依次流转：创建 → 复核 → 付款 → 到账。
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn primary" onclick="saveReconcile()">创建</button>
    </div>`, 620);
}
function saveReconcile(){
  const leg = Number($('#rc-leg').value)||1;
  const orderNo = ($('#rc-order').value||'').trim();
  const amount = Number($('#rc-amount').value)||0;
  if(!orderNo){ toast('请填写订单号','err'); return; }
  const no = nextNo('RC','202611');
  reconciles.unshift({no, leg, orderNo, amount, status:'待创建'});
  closeOverlay();
  toast('对账单已创建：'+no+'（'+legName(leg)+'）','ok');
  switchView('reconcile');
}

/* =========================================================
   视图 9：退货管理（买方发起 · 服务方审核 · 冲正对账/结算）
   ========================================================= */
function viewReturns(){
  const rows = returns.map(r=>`
      <tr>
        <td class="mono">${esc(r.no)}</td>
        <td class="mono">${esc(r.orderNo)}</td>
        <td>${esc(r.product)}</td>
        <td>${intFmt(r.qty)}</td>
        <td>${esc(r.reason)}</td>
        <td class="mono" style="color:var(--danger)">¥${fmt(r.refund)}</td>
        <td>${statusTag(r.status)}</td>
        <td class="ops">${returnOps(r)}</td>
      </tr>`).join('');

  return `
    <h2 class="page-title">退货管理</h2>
    <div class="page-sub">买方签收后可新增退货单 → 服务方审核；通过后退货，并冲正对应对账 / 结算（refund_amount，BR-12）</div>
    <div class="stats">
      <div class="stat"><div class="k">待审核</div><div class="v" style="color:#D48806">${returns.filter(r=>r.status==='待审核').length}<small>单</small></div></div>
      <div class="stat"><div class="k">退货中</div><div class="v" style="color:#D4680A">${returns.filter(r=>r.status==='退货中').length}<small>单</small></div></div>
      <div class="stat"><div class="k">已退货</div><div class="v" style="color:#389E0D">${returns.filter(r=>r.status==='已退货').length}<small>单</small></div></div>
      <div class="stat"><div class="k">退款金额合计</div><div class="v" style="color:#EE0000">¥${fmt(returns.reduce((s,r)=>s+(Number(r.refund)||0),0))}</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>退货单列表</h3>
        <div style="flex:1"></div>
        <button class="btn primary" onclick="openCreateReturn()">+ 新增退货单（买方）</button>
      </div>
      <div class="card-body" style="padding:0">
        <table class="tbl">
          <thead><tr>
            <th>退货单号</th><th>订单号</th><th>商品</th><th>退货数量</th><th>退货原因</th><th>退款金额</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="8" class="empty">暂无退货单</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}
function returnOps(r){
  if(r.status==='待审核') return `<button class="btn sm primary" onclick="auditReturn('${r.no}',true)">审核通过</button>
          <button class="btn sm danger" onclick="auditReturn('${r.no}',false)">拒绝</button>`;
  if(r.status==='退货中') return `<button class="btn sm primary" onclick="finishReturn('${r.no}')">确认退货完成</button>`;
  return '<span style="color:var(--text-2);font-size:12px">已处理</span>';
}
function auditReturn(no, pass){
  const r = returns.find(x=>x.no===no); if(!r) return;
  if(r.status!=='待审核'){ toast('该退货单已处理（CONSIGN_0002）','err'); return; }
  r.status = pass ? '退货中' : '已拒绝';
  toast(pass ? ('退货审核通过：'+no+'，进入退货中，将冲正对账/结算（BR-12）') : ('已拒绝退货：'+no), pass?'ok':'err');
  switchView('returns');
}
function finishReturn(no){
  const r = returns.find(x=>x.no===no); if(!r) return;
  if(r.status!=='退货中'){ toast('当前状态不允许该操作','err'); return; }
  r.status = '已退货';
  toast('退货完成：'+no+'，退款冲正 ¥'+fmt(r.refund)+' 已回填对账/结算（BR-12）','ok');
  switchView('returns');
}
function openCreateReturn(){
  openModal(`
    <div class="modal-head"><h3>新增退货单（买方发起）</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field"><span><i>*</i>订单号</span><input id="rt-order" placeholder="如：ORD20261101000305"></label>
        <label class="field col-2"><span><i>*</i>商品</span><input id="rt-product" placeholder="如：脚手架钢管 Φ48×3.0"></label>
        <label class="field"><span><i>*</i>退货数量</span><input id="rt-qty" type="number" min="1" value="1"></label>
        <label class="field"><span><i>*</i>退款金额(元)</span><input id="rt-refund" type="number" min="0" value="0"></label>
        <label class="field col-3"><span><i>*</i>退货原因</span><input id="rt-reason" placeholder="如：到货外观破损 / 规格不符"></label>
      </div>
      <p style="color:var(--text-2);font-size:12px;margin:12px 0 0">
        * 退货单由买方在签收后发起，服务方审核通过后退货，并冲正对应对账 / 结算（refund_amount）。
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn primary" onclick="saveReturn()">提交退货单</button>
    </div>`, 620);
}
function saveReturn(){
  const orderNo = ($('#rt-order').value||'').trim();
  const product = ($('#rt-product').value||'').trim();
  const qty = Number($('#rt-qty').value)||0;
  const refund = Number($('#rt-refund').value)||0;
  const reason = ($('#rt-reason').value||'').trim();
  if(!orderNo){ toast('请填写订单号','err'); return; }
  if(!product){ toast('请填写商品','err'); return; }
  if(qty<=0){ toast('请填写退货数量','err'); return; }
  if(!reason){ toast('请填写退货原因','err'); return; }
  const no = nextNo('RT');
  returns.unshift({no, orderNo, product, qty, reason, refund, status:'待审核'});
  closeOverlay();
  toast('退货单已提交：'+no+'，待服务方审核','ok');
  switchView('returns');
}

/* ---------- 弹窗容器 ---------- */
function openModal(inner, width){
  $('#overlay').innerHTML =
    `<div class="mask" onclick="if(event.target===this)closeOverlay()">
       <div class="modal" style="${width?'width:'+width+'px':''}">${inner}</div>
     </div>`;
}

/* ---------- 启动 ---------- */
renderSidebar();
switchView('manage');
</script>
</body>
</html>
